<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Portfolio layout check</title><style>body{margin:0;background:#18222d;color:white;font:13px system-ui}header{position:sticky;top:0;padding:12px;background:#243445;z-index:2;display:flex;flex-wrap:wrap;gap:18px;align-items:center}select,button{font:inherit;padding:7px;background:#0f1e2d;color:white;border:1px solid #587084;border-radius:4px}iframe{height:820px;border:0;display:block;background:#080e17}pre{white-space:pre-wrap;padding:14px;margin:0;font-size:11px}label{display:flex;align-items:center;gap:8px}.frame-wrap{padding:10px;overflow:auto}p{margin:0}</style></head><body><header><label>Viewport <select id="width"><option>320</option><option>375</option><option selected>390</option><option>480</option><option>768</option><option>1024</option><option>1440</option><option>1920</option></select></label><label>Page <select id="page"><option value="../index.html">Portfolio</option><option value="../resume.html">CV</option></select></label><button id="audit">Check layout</button><button id="motionAudit">Check interactions</button><span id="summary" role="status">Loading</span></header><div class="frame-wrap"><iframe id="preview" title="Responsive portfolio preview" src="../index.html" width="390"></iframe></div><pre id="results"></pre><script>
const frame=document.getElementById('preview'),width=document.getElementById('width'),page=document.getElementById('page');
function audit(){const d=frame.contentDocument,w=frame.contentWindow;let overflow=[],clipped=[],overlap=[];const visible=e=>e.getClientRects().length&&w.getComputedStyle(e).visibility!=='hidden';for(const e of d.querySelectorAll('main *,nav *,footer *')){if(!visible(e)||e.closest('svg,.orb-stage,.project-graphic,.transition-ghost,.retina-shower')||e.classList.contains('pointer-aura'))continue;const r=e.getBoundingClientRect();if(r.width&& (r.right>d.documentElement.clientWidth+1||r.left < -1))overflow.push({tag:e.tagName,class:e.className,text:e.textContent.slice(0,70)});if(e.clientWidth&&e.scrollWidth>e.clientWidth+2&&w.getComputedStyle(e).overflowX==='hidden')clipped.push(e.className);}for(const container of d.querySelectorAll('.hero-copy,.identity,.project,.project-footer,.section-heading,.theme-switch,.theme-caption,.chart-row,.range-chips,.publication-row,.service-title,.evidence-copy,.cv-entry,.cv-header')){const children=[...container.children].filter(visible);for(let i=0;i<children.length;i++)for(let j=i+1;j<children.length;j++){const a=children[i].getBoundingClientRect(),b=children[j].getBoundingClientRect();if(Math.min(a.right,b.right)-Math.max(a.left,b.left)>2&&Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top)>2)overlap.push({parent:container.className,a:children[i].tagName,b:children[j].tagName});}}
const result={viewport:w.innerWidth,clientWidth:d.documentElement.clientWidth,content:d.documentElement.scrollWidth,pageOverflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,overflow,clipped,overlap,brokenImages:[...d.images].filter(i=>i.currentSrc&&i.complete&&!i.naturalWidth).map(i=>i.src)};document.getElementById('results').textContent=JSON.stringify(result,null,2);document.getElementById('summary').textContent=`${w.innerWidth}px · ${overflow.length + (result.pageOverflow ? 1 : 0)} overflow · ${overlap.length} overlap · ${result.brokenImages.length} broken images`;}
width.addEventListener('change',()=>{frame.width=width.value;setTimeout(audit,250)});function loadPreview(){const url=new URL(page.value,location.href);url.searchParams.set('preview-build',String(Date.now()));frame.src=url.href;}page.addEventListener('change',loadPreview);frame.addEventListener('load',()=>{setTimeout(audit,300)});document.getElementById('audit').addEventListener('click',audit);loadPreview();
// Browser-visible regression checks for interruption, natural layout, and the touch path.
document.getElementById('motionAudit').addEventListener('click',async()=>{
 const button=document.getElementById('motionAudit');button.disabled=true;
 const d=frame.contentDocument,w=frame.contentWindow,checks=[];
 const record=(name,passed,detail)=>{checks.push({name,passed,detail});document.getElementById('summary').textContent=`Checking: ${name}`;document.getElementById('results').textContent=JSON.stringify({width:w.innerWidth,checks},null,2);};
 const next=()=>new Promise(resolve=>w.requestAnimationFrame(resolve));
 const settle=async()=>{await next();await next();await Promise.allSettled(d.getAnimations().filter(a=>a.effect?.getTiming().iterations!==Infinity).map(a=>a.finished));await next();};
 const motion=d.querySelector('[data-motion-toggle]');const wasOn=motion.getAttribute('aria-pressed')==='true';
 const oldY=w.scrollY;
 try{
  if(!wasOn)motion.click();
  const tabs=[...d.querySelectorAll('[data-study]')];
  tabs[1].click();await next();await next();
  record('Evidence transitions animate',d.querySelector('#evidencePanels').getAnimations().length>0);
  for(const i of [2,3,0,2]){tabs[i].click();await next();}
  await settle();
  const shown=[...d.querySelectorAll('#evidencePanels > .evidence-panel')].filter(e=>!e.hidden);
  record('Rapid tabs keep the latest selection',shown.length===1&&shown[0].id==='panel-calibration',shown.map(e=>e.id));
  record('Panel returns to natural height',d.querySelector('#evidencePanels').style.height===''&&!d.querySelector('.transition-ghost'));
  d.querySelector('[data-filter="All"]').click();await settle();
  const more=d.getElementById('showPublications');if(more.getAttribute('aria-expanded')==='true'){more.click();await settle();}
  more.click();await next();await next();
  record('Show all animates the list height',d.getElementById('publicationList').getAnimations().length>0);
  await settle();
  record('All 15 entries are visible',d.querySelectorAll('#publicationList > .publication-row').length===15);
  more.click();more.click();more.click();await settle();
  record('Rapid collapse finishes with five entries',d.querySelectorAll('#publicationList > .publication-row').length===5&&more.getAttribute('aria-expanded')==='false');
  for(const filter of ['Journal Articles','Conference Papers','Manuscripts','All']){d.querySelector(`[data-filter="${filter}"]`).click();await next();}
  await settle();record('Rapid filtering clears stale layers',!d.querySelector('.transition-ghost')&&d.getElementById('publicationList').style.height==='');
  const details=d.querySelector('.journal-details'),summary=details.querySelector('summary');
  if(details.open){summary.click();await settle();}
  summary.click();await next();summary.click();await next();summary.click();await settle();
  record('Interrupted journal opening finishes open',details.open&&summary.getAttribute('aria-expanded')==='true'&&d.getElementById('journalContent').style.height==='');
  summary.click();await settle();record('Journal closes completely',!details.open);
  if(w.innerWidth<=680){const menu=d.querySelector('.menu-toggle');menu.click();await settle();const opened=menu.getAttribute('aria-expanded')==='true';menu.click();await settle();record('Phone menu opens and closes',opened&&!d.getElementById('navigation').classList.contains('open'));}
  const orb=d.getElementById('orbControl');orb.scrollIntoView({behavior:'instant',block:'center'});await next();await next();
  record('Orb is animating in this viewport',w.getComputedStyle(d.querySelector('.orb-mesh')).animationName!=='none'&&w.getComputedStyle(d.querySelector('.orb-mesh')).animationPlayState==='running');
  const r=orb.getBoundingClientRect(),x=Math.max(20,Math.min(w.innerWidth-20,r.x+r.width*.5)),y=Math.max(90,Math.min(w.innerHeight-30,r.y+r.height*.5));
  const emit=(type,px,py)=>{const touch=new w.Touch({identifier:1,target:orb,clientX:px,clientY:py,pageX:px+w.scrollX,pageY:py+w.scrollY});const event=new w.TouchEvent(type,{bubbles:true,cancelable:true,touches:type==='touchend'?[]:[touch],targetTouches:type==='touchend'?[]:[touch],changedTouches:[touch]});orb.dispatchEvent(event);return !event.defaultPrevented;};
  let nativeScroll=emit('touchstart',x,y);for(let i=0;i<8;i++){nativeScroll=emit('touchmove',x+i*3,y+i*4)&&nativeScroll;await next();}
  const canvas=d.getElementById('touchLight'),ctx=canvas.getContext('2d'),ratio=canvas.width/w.innerWidth;
  const pixel=ctx.getImageData(Math.round((x+21)*ratio),Math.round((y+28)*ratio),1,1).data;
  record('Simulated finger slide draws visible light',pixel[3]>0,{alpha:pixel[3]});
  record('Touch handlers preserve native scrolling',nativeScroll&&w.getComputedStyle(orb).touchAction==='pan-y');emit('touchend',x+21,y+28);
  d.querySelector('[data-hello]').click();record('Portrait has a playful response',d.getElementById('playfulToast').textContent.length>15);
  d.getElementById('retinaRain').click();d.getElementById('retinaRain').click();record('Retina shower is bounded',d.querySelectorAll('#retinaShower img').length===9);
  await settle();record('Retina particles clean themselves up',d.querySelectorAll('#retinaShower img').length===0);
  motion.click();record('Motion off stops the sphere',w.getComputedStyle(d.querySelector('.orb-mesh')).animationName==='none');motion.click();
  record('Motion can be explicitly enabled',d.documentElement.dataset.motion==='on'&&[...d.querySelectorAll('[data-motion-toggle]')].every(b=>b.getAttribute('aria-pressed')==='true'));
 }catch(error){record('Check completed without errors',false,String(error));}
 finally{if(!wasOn&&motion.getAttribute('aria-pressed')==='true')motion.click();w.scrollTo({top:oldY,behavior:'instant'});button.disabled=false;document.getElementById('results').textContent=JSON.stringify({width:w.innerWidth,checks},null,2);document.getElementById('summary').textContent=`${checks.filter(c=>c.passed).length}/${checks.length} interaction checks passed at ${w.innerWidth}px`;}
});
</script></body></html>
