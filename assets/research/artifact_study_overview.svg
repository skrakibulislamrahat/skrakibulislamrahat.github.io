<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Fundus artifact robustness study overview</title>
  <desc id="desc">A three-part visual summary of internal versus external discrimination, common-input background sensitivity, and audit findings from the 12-model APTOS to processed Messidor-2 study.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fcfa"/>
      <stop offset="1" stop-color="#edf4f0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f83bb"/>
      <stop offset="1" stop-color="#69c8e9"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc6a36"/>
      <stop offset="1" stop-color="#f4a56e"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e9675"/>
      <stop offset="1" stop-color="#41b896"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#0b1914" flood-opacity=".09"/>
    </filter>
    <style>
      .title{font:700 30px Inter,Arial,sans-serif;fill:#10241d}
      .sub{font:500 14px Inter,Arial,sans-serif;fill:#687970}
      .panel{fill:#fff;stroke:#d7e5de;stroke-width:1.4}
      .ptitle{font:700 18px Inter,Arial,sans-serif;fill:#17382c}
      .kicker{font:700 11px Inter,Arial,sans-serif;fill:#74877e;letter-spacing:1.2px}
      .label{font:600 13px Inter,Arial,sans-serif;fill:#52655c}
      .small{font:500 12px Inter,Arial,sans-serif;fill:#718179}
      .tiny{font:500 10px Inter,Arial,sans-serif;fill:#7f8e87}
      .num{font:800 34px Inter,Arial,sans-serif;fill:#122b22}
      .metric{font:800 25px Inter,Arial,sans-serif;fill:#122b22}
    </style>
  </defs>

  <rect width="1200" height="720" rx="30" fill="url(#bg)"/>
  <text x="46" y="52" class="title">Reduced background sensitivity did not guarantee external generalization</text>
  <text x="46" y="80" class="sub">12 models · ResNet-18 + EfficientNet-B0 · RAW vs CLEAN · seeds 13, 42, 77 · APTOS 2019 → processed Messidor-2</text>

  <!-- PANEL 1 -->
  <g filter="url(#shadow)"><rect class="panel" x="38" y="112" width="350" height="558" rx="23"/></g>
  <text x="64" y="148" class="ptitle">1 · Generalization gap</text>
  <text x="64" y="171" class="small">Internal ranking did not transfer.</text>

  <rect x="64" y="208" width="298" height="146" rx="18" fill="#eef7fb" stroke="#d9e9f1"/>
  <text x="84" y="236" class="kicker">APTOS TEST</text>
  <text x="84" y="280" class="num">0.996–0.999</text>
  <text x="84" y="305" class="label">AUC range · 12 variants</text>
  <rect x="84" y="324" width="236" height="10" rx="5" fill="#dce9e4"/>
  <rect x="84" y="324" width="235" height="10" rx="5" fill="url(#blue)"/>
  <circle cx="328" cy="329" r="11" fill="#1f9a79"/>

  <g transform="translate(175 365)">
    <circle cx="0" cy="0" r="24" fill="#132c23"/>
    <path d="M-8 -3 H8 M3 -8 L8 -3 L3 2" fill="none" stroke="#dff7eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="214" y="370" class="kicker">DOMAIN SHIFT</text>
  <text x="214" y="389" class="small">same models</text>

  <rect x="64" y="411" width="298" height="171" rx="18" fill="#fff3ed" stroke="#f2dfd4"/>
  <text x="84" y="440" class="kicker">PROCESSED MESSIDOR-2</text>
  <text x="84" y="484" class="num">0.564–0.664</text>
  <text x="84" y="509" class="label">external AUC range</text>
  <rect x="84" y="532" width="236" height="10" rx="5" fill="#eee7e3"/>
  <rect x="84" y="532" width="148" height="10" rx="5" fill="url(#orange)"/>
  <text x="84" y="561" class="small">External AUC dropped across both models.</text>

  <rect x="64" y="604" width="298" height="42" rx="21" fill="#132c23"/>
  <text x="84" y="630" style="font:700 13px Inter,Arial,sans-serif;fill:#dff7eb">Internal ≠ external performance</text>

  <!-- PANEL 2 -->
  <g filter="url(#shadow)"><rect class="panel" x="410" y="112" width="430" height="558" rx="23"/></g>
  <text x="436" y="148" class="ptitle">2 · Same-input sensitivity</text>
  <text x="436" y="171" class="small">RAW vs CLEAN on identical inputs.</text>

  <text x="436" y="211" class="kicker">APTOS · IDENTICAL RAW INPUTS</text>
  <rect x="436" y="228" width="378" height="91" rx="16" fill="#f7faf8" stroke="#e3ece7"/>
  <text x="454" y="253" class="label">ResNet-18</text>
  <text x="613" y="253" class="small">0.0227 → 0.0204</text>
  <rect x="454" y="266" width="214" height="10" rx="5" fill="#e7efeb"/>
  <rect x="454" y="266" width="33" height="10" rx="5" fill="url(#blue)"/>
  <rect x="454" y="280" width="30" height="10" rx="5" fill="url(#green)"/>

  <text x="454" y="305" class="label">EfficientNet-B0</text>
  <text x="613" y="305" class="small">0.1477 → 0.0748</text>
  <rect x="454" y="318" width="214" height="10" rx="5" fill="#f0e9e5"/>
  <rect x="454" y="318" width="212" height="10" rx="5" fill="url(#orange)"/>
  <rect x="454" y="332" width="107" height="10" rx="5" fill="url(#green)"/>

  <rect x="688" y="266" width="108" height="62" rx="16" fill="#e9f7f1"/>
  <text x="703" y="290" style="font:700 11px Inter,Arial,sans-serif;fill:#4b7566">EFFB0</text>
  <text x="703" y="316" style="font:800 17px Inter,Arial,sans-serif;fill:#1f7158">↓ 49.4%</text>

  <text x="436" y="394" class="kicker">MESSIDOR-2 · COMMON INPUTS</text>
  <rect x="436" y="411" width="378" height="104" rx="16" fill="#f7faf8" stroke="#e3ece7"/>
  <text x="454" y="438" class="label">ResNet-18</text>
  <text x="613" y="438" class="small">0.0258 → 0.0262</text>
  <rect x="454" y="451" width="214" height="10" rx="5" fill="#e7efeb"/>
  <rect x="454" y="451" width="33" height="10" rx="5" fill="url(#blue)"/>
  <rect x="454" y="465" width="34" height="10" rx="5" fill="url(#green)"/>

  <text x="454" y="493" class="label">EfficientNet-B0</text>
  <text x="613" y="493" class="small">0.3326 → 0.1708</text>
  <rect x="454" y="506" width="214" height="10" rx="5" fill="#f0e9e5"/>
  <rect x="454" y="506" width="214" height="10" rx="5" fill="url(#orange)"/>
  <rect x="454" y="520" width="110" height="10" rx="5" fill="url(#green)"/>

  <rect x="688" y="451" width="108" height="65" rx="16" fill="#e9f7f1"/>
  <text x="703" y="476" style="font:700 11px Inter,Arial,sans-serif;fill:#4b7566">EFFB0</text>
  <text x="703" y="503" style="font:800 17px Inter,Arial,sans-serif;fill:#1f7158">↓ 48.6%</text>

  <rect x="436" y="590" width="378" height="56" rx="18" fill="#132c23"/>
  <text x="456" y="614" style="font:700 13px Inter,Arial,sans-serif;fill:#dff7eb">Key contrast</text>
  <text x="456" y="635" style="font:600 12px Inter,Arial,sans-serif;fill:#bcd9cc">Lower sensitivity. No external gain.</text>

  <!-- PANEL 3 -->
  <g filter="url(#shadow)"><rect class="panel" x="862" y="112" width="300" height="558" rx="23"/></g>
  <text x="888" y="148" class="ptitle">3 · Audit signals</text>
  <text x="888" y="171" class="small">Signals found in data and models.</text>

  <rect x="888" y="205" width="116" height="112" rx="17" fill="#edf8f3"/>
  <text x="904" y="230" class="kicker">BACKGROUND</text>
  <text x="904" y="248" class="kicker">ONLY AUC</text>
  <text x="904" y="286" class="metric">0.9705</text>
  <text x="904" y="304" class="tiny">APTOS test</text>

  <rect x="1018" y="205" width="116" height="112" rx="17" fill="#eef5fa"/>
  <text x="1034" y="230" class="kicker">SOURCE</text>
  <text x="1034" y="248" class="kicker">AUC</text>
  <text x="1034" y="286" class="metric">1.000</text>
  <text x="1034" y="304" class="tiny">APTOS vs Messidor</text>

  <rect x="888" y="331" width="116" height="112" rx="17" fill="#fbf1eb"/>
  <text x="904" y="356" class="kicker">EXACT</text>
  <text x="904" y="374" class="kicker">DUPLICATES</text>
  <text x="904" y="412" class="metric">69</text>
  <text x="904" y="430" class="tiny">cross-split pairs</text>

  <rect x="1018" y="331" width="116" height="112" rx="17" fill="#f2f0fa"/>
  <text x="1034" y="356" class="kicker">TRAINED</text>
  <text x="1034" y="374" class="kicker">VARIANTS</text>
  <text x="1034" y="412" class="metric">12</text>
  <text x="1034" y="430" class="tiny">2×2×3 design</text>

  <rect x="888" y="466" width="246" height="132" rx="20" fill="#132c23"/>
  <text x="910" y="494" style="font:700 13px Inter,Arial,sans-serif;fill:#a9ffc8">KEY RESULT</text>
  <text x="910" y="530" style="font:800 17px Inter,Arial,sans-serif;fill:#f5fff8">Sensitivity ↓ 49.4%</text>
  <text x="910" y="563" style="font:800 17px Inter,Arial,sans-serif;fill:#f5fff8">External AUC ↓ 0.0396</text>

  <rect x="888" y="616" width="246" height="30" rx="15" fill="#e9f7f1"/>
  <text x="905" y="636" style="font:700 10px Inter,Arial,sans-serif;fill:#2b745d;letter-spacing:.8px">ROBUSTNESS ≠ GENERALIZATION</text>
</svg>